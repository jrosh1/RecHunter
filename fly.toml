# fly.toml app configuration file generated for recsniper on 2026-06-10T07:36:23-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'recsniper'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/recsniper.db'
  HOST = '0.0.0.0'
  LOG_PATH = '/data/recsniper.log'
  PORT = '8080'

[[mounts]]
  source = 'recsniper_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
